<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <title>Orçamento | S.O.S. Conserto de Roupas</title>
</head>

<body>

    <!-- Cabeçalho -->
    <header>

        <div class="header-brand">
            <img class="logo" src="imagens/logo2.png" alt="Logo da S.O.S. Conserto de Roupas">
            <h1>S.O.S. Conserto de Roupas</h1>
        </div>

        <nav>
            <a href="index.html">Início</a>
            <a href="servicos.html">Serviços</a>
            <a href="sobre.html">Sobre</a>
            <a href="orcamento.html">Orçamento</a>
        </nav>

    </header>


    <!-- Conteúdo principal -->
    <main>

        <section id="orcamento">

            <h2>Solicite seu orçamento</h2>

            <p>
                Preencha as informações abaixo para solicitar
                um orçamento.
            </p>


            <!-- Formulário -->
            <form id="formulario-orcamento">

                <!-- Nome -->
                <div class="campo">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                    >

                </div>


                <!-- WhatsApp -->
                <div class="campo">

                    <label for="whatsapp">
                        WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="whatsapp"
                        name="whatsapp"
                        placeholder="Digite seu WhatsApp"
                    >

                </div>


                <!-- Tipo de peça -->
                <div class="campo">

                    <label for="peca">
                        Tipo de peça
                    </label>

                    <select id="peca" name="peca">

                        <option value="">
                            Selecione uma peça
                        </option>

                        <option value="calca">
                            Calça
                        </option>

                        <option value="camisa">
                            Camisa
                        </option>

                        <option value="vestido">
                            Vestido
                        </option>

                        <option value="blusa">
                            Blusa
                        </option>

                        <option value="jaqueta">
                            Jaqueta
                        </option>

                        <option value="outra">
                            Outra
                        </option>

                    </select>

                </div>


                <!-- Serviço -->
                <div class="campo">

                    <label for="servico">
                        Serviço desejado
                    </label>

                    <select id="servico" name="servico">

                        <option value="">
                            Selecione um serviço
                        </option>

                        <option value="ajuste">
                            Ajuste
                        </option>

                        <option value="barra">
                            Barra
                        </option>

                        <option value="conserto">
                            Conserto
                        </option>

                        <option value="troca-ziper">
                            Troca de zíper
                        </option>

                        <option value="outro">
                            Outro
                        </option>

                    </select>

                    <div id="servicos-adicionais"></div>

                    <button type="button" id="adicionar-servico" class="botao-adicionar-servico">
                        + Adicionar outra peça e serviço
                    </button>

                </div>


                <!-- Descrição -->
                <div class="campo">

                    <label for="descricao">
                        Descreva o que precisa ser feito
                    </label>

                    <textarea
                        id="descricao"
                        name="descricao"
                        rows="5"
                        placeholder="Explique o que precisa ser ajustado ou consertado"
                    ></textarea>

                </div>


                <!-- Botão -->
                <button type="submit">
                    Solicitar orçamento
                </button>

            </form>

        </section>

    </main>


    <!-- Rodapé -->
    <footer>

        <p>
            &copy; 2026 S.O.S. Conserto de Roupas
        </p>
        <p class="footer-credit">
            Desenvolvido por
            <a href="https://www.linkedin.com/in/dennys-ricardo-55a051393?utm_source=share_via&amp;utm_content=profile&amp;utm_medium=member_android" target="_blank" rel="noopener noreferrer">Dennys Ricardo</a>
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
